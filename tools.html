<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tools · NFCMedia</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Lille ekstra-styling kun til denne side */
    .tools-wrapper{
      max-width: 800px;
      margin: 40px auto 70px;
    }

    .tool-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:10px;
      box-shadow:0 4px 18px rgba(0,0,0,.05);
      padding:20px 18px 18px;
    }

    .tool-card h2{
      margin:0 0 6px;
      font-size:22px;
      letter-spacing:.06em;
    }

    .tool-card p{
      margin:0 0 18px;
      color:#555;
      font-size:14px;
      line-height:1.5;
    }

    .tool-label{
      display:block;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:#888;
      margin-bottom:6px;
    }

    .tool-input-row{
      display:flex;
      gap:8px;
      margin-bottom:8px;
    }

    .tool-input{
      flex:1;
      border-radius:999px;
      border:1px solid var(--line);
      padding:9px 12px;
      font-family:inherit;
      font-size:14px;
    }

    .tool-input::placeholder{
      color:#9ca3af;
    }

    .tool-button{
      border-radius:999px;
      border:0;
      background:#111;
      color:#fff;
      padding:9px 14px;
      font-size:11px;
      font-weight:700;
      letter-spacing:.14em;
      text-transform:uppercase;
      cursor:pointer;
      white-space:nowrap;
    }

    .tool-button:hover{
      opacity:.9;
    }

    .tool-error{
      color:#e11d48;
      font-size:12px;
      min-height:1em;
      margin-bottom:6px;
    }

    .tool-results{
      margin-top:16px;
      border-top:1px solid var(--line);
      padding-top:14px;
      display:none;
    }

    .tool-row{
      margin-bottom:12px;
    }

    .tool-row-label{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:#888;
      margin-bottom:4px;
    }

    .tool-row-text{
      font-size:14px;
      word-break:break-word;
    }

    .tool-thumb{
      max-width:100%;
      border-radius:6px;
      border:1px solid var(--line);
      display:block;
    }

    .tool-thumb-url{
      font-size:12px;
      margin-top:4px;
      color:#555;
      word-break:break-word;
    }

    .tool-textarea{
      width:100%;
      min-height:90px;
      max-height:220px;
      resize:vertical;
      border-radius:6px;
      border:1px solid var(--line);
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size:12px;
      padding:8px 10px;
    }

    .tool-copy-row{
      margin-top:6px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      font-size:12px;
      color:#666;
    }

    .tool-copy-btn{
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      font-size:11px;
      padding:5px 10px;
      font-weight:600;
      letter-spacing:.08em;
      text-transform:uppercase;
      cursor:pointer;
    }

    .tool-copy-badge{
      font-size:11px;
      color:#16a34a;
      margin-top:4px;
      opacity:0;
      transition:opacity .15s ease;
    }

    .tool-copy-badge.visible{
      opacity:1;
    }

    @media (max-width:640px){
      .tool-input-row{
        flex-direction:column;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">NFCMEDIA.DK</a>
      <button class="nav-toggle" aria-expanded="false" aria-label="Menu">☰</button>
      <nav class="nav">
        <a href="index.html">HOME</a>
        <a href="videoer.html">VIDEOER</a>
        <a href="billeder.html">BILLEDER</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">TOOLS</h1>

    <div class="tools-wrapper">
      <div class="tool-card">
        <h2>YOUTUBE EMBED HELPER</h2>
        <p>
          Indsæt et YouTube-link og få automatisk <strong>titel, thumbnail-link og embed-kode</strong>, som du kan bruge på din videoside.
        </p>

        <label for="yt-url" class="tool-label">YouTube-link</label>
        <div class="tool-input-row">
          <input id="yt-url" class="tool-input" type="text"
                 placeholder="f.eks. https://www.youtube.com/watch?v=dQw4w9WgXcQ" />
          <button id="generate-btn" class="tool-button" type="button">HENT DATA</button>
        </div>
        <div id="error" class="tool-error"></div>

        <div id="results" class="tool-results">
          <div class="tool-row">
            <div class="tool-row-label">Titel</div>
            <div id="video-title" class="tool-row-text">–</div>
          </div>

          <div class="tool-row">
            <div class="tool-row-label">Thumbnail</div>
            <img id="thumbnail-img" class="tool-thumb" src="" alt="Thumbnail" />
            <div id="thumbnail-url" class="tool-thumb-url"></div>
          </div>

          <div class="tool-row">
            <div class="tool-row-label">Embed kode</div>
            <textarea id="embed-code" class="tool-textarea" readonly></textarea>
            <div class="tool-copy-row">
              <span>Copy–paste direkte ind i din HTML.</span>
              <button id="copy-btn" class="tool-copy-btn" type="button">KOPIÉR</button>
            </div>
            <div id="copy-badge" class="tool-copy-badge">Embed kode kopieret ✅</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> NFCMedia</div>
  </footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>

  <script>
    const urlInput = document.getElementById("yt-url");
    const generateBtn = document.getElementById("generate-btn");
    const errorEl = document.getElementById("error");
    const resultsEl = document.getElementById("results");
    const titleEl = document.getElementById("video-title");
    const thumbImgEl = document.getElementById("thumbnail-img");
    const thumbUrlEl = document.getElementById("thumbnail-url");
    const embedTextarea = document.getElementById("embed-code");
    const copyBtn = document.getElementById("copy-btn");
    const copyBadge = document.getElementById("copy-badge");

    function extractVideoId(rawUrl) {
      if (!rawUrl) return null;

      let url = rawUrl.trim();

      if (!url.startsWith("http")) {
        url = "https://" + url;
      }

      let parsed;
      try {
        parsed = new URL(url);
      } catch (e) {
        return null;
      }

      const host = parsed.hostname.replace("www.", "").toLowerCase();

      // youtu.be/VIDEOID
      if (host === "youtu.be") {
        const id = parsed.pathname.slice(1).split("/")[0];
        return id || null;
      }

      if (!host.endsWith("youtube.com")) {
        return null;
      }

      // youtube.com/watch?v=VIDEOID
      if (parsed.searchParams.get("v")) {
        return parsed.searchParams.get("v");
      }

      // /shorts/VIDEOID eller /embed/VIDEOID
      const parts = parsed.pathname.split("/").filter(Boolean);
      if (parts.length >= 2 && (parts[0] === "shorts" || parts[0] === "embed")) {
        return parts[1];
      }

      return null;
    }

    async function fetchTitle(originalUrl) {
      try {
        const oembedUrl =
          "https://www.youtube.com/oembed?url=" +
          encodeURIComponent(originalUrl.trim()) +
          "&format=json";

        const res = await fetch(oembedUrl);
        if (!res.ok) throw new Error("oEmbed failed");
        const data = await res.json();
        return data.title || null;
      } catch (e) {
        return null;
      }
    }

    async function handleGenerate() {
      const rawUrl = urlInput.value.trim();
      errorEl.textContent = "";
      copyBadge.classList.remove("visible");

      if (!rawUrl) {
        errorEl.textContent = "Indsæt et YouTube-link først.";
        resultsEl.style.display = "none";
        return;
      }

      const videoId = extractVideoId(rawUrl);
      if (!videoId) {
        errorEl.textContent = "Kunne ikke læse video-ID. Tjek at linket er et gyldigt YouTube-link.";
        resultsEl.style.display = "none";
        return;
      }

      const embedUrl = "https://www.youtube.com/embed/" + videoId;
      const thumbUrl = "https://img.youtube.com/vi/" + videoId + "/maxresdefault.jpg";

      resultsEl.style.display = "block";

      thumbImgEl.src = thumbUrl;
      thumbUrlEl.textContent = thumbUrl;

      const embedCode = `<iframe width="560" height="315"
  src="${embedUrl}"
  title="YouTube video player"
  frameborder="0"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
  referrerpolicy="strict-origin-when-cross-origin"
  allowfullscreen></iframe>`;

      embedTextarea.value = embedCode;

      titleEl.textContent = "Henter titel…";

      const title = await fetchTitle(rawUrl);
      if (title) {
        titleEl.textContent = title;
      } else {
        titleEl.textContent = "Kunne ikke hente titel automatisk – skriv den selv.";
      }
    }

    generateBtn.addEventListener("click", (e) => {
      e.preventDefault();
      handleGenerate();
    });

    urlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        handleGenerate();
      }
    });

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(embedTextarea.value);
        copyBadge.classList.add("visible");
        setTimeout(() => copyBadge.classList.remove("visible"), 1500);
      } catch (e) {
        copyBadge.textContent = "Kunne ikke kopiere automatisk – markér teksten og kopier.";
        copyBadge.classList.add("visible");
      }
    });
  </script>

  <script>
    (function(){
      const btn = document.querySelector('.nav-toggle');
      const nav = document.querySelector('.nav');
      if(!btn || !nav) return;
      btn.addEventListener('click', () => {
        const open = nav.classList.toggle('is-open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        document.body.style.overflow = open ? 'hidden' : '';
      });
    })();
  </script>
</body>
</html>
