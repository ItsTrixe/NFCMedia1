 <script>
  // 🔹 Sæt din egen API-nøgle her:
  const YT_API_KEY = "AIzaSyDyUTI3GYxqcN-sDHPDCK9OOjhS6l6q8c4"; // <-- Indsæt din nøgle her mellem anførselstegnene
  const CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 6 timer

  const grid = document.querySelector('.video-grid');
  const cards = Array.from(grid.children);
  const select = document.getElementById('sortSelect');

  // Giv hvert kort et unikt index (bruges til 'seneste' og 'ældste')
  cards.forEach((el, i) => el.dataset.index = i);

  // Hjælpefunktion til at udtrække YouTube video-ID
  function getVideoIdFromCard(card){
    const iframe = card.querySelector('iframe');
    if(!iframe) return null;
    const match = iframe.src.match(/embed\/([a-zA-Z0-9_-]{6,})/);
    return match ? match[1] : null;
  }

  const videoIds = cards.map(getVideoIdFromCard).filter(Boolean);
  const cacheKey = 'yt_stats_cache';

  function loadCache(){ try { return JSON.parse(localStorage.getItem(cacheKey)||'{}'); } catch { return {}; } }
  function saveCache(obj){ localStorage.setItem(cacheKey, JSON.stringify(obj)); }
  function isFresh(ts){ return (Date.now() - ts) < CACHE_TTL_MS; }

  async function fetchStats(ids){
    if (!ids.length) return {};
    const url = new URL('https://www.googleapis.com/youtube/v3/videos');
    url.searchParams.set('key', YT_API_KEY);
    url.searchParams.set('part', 'statistics');
    url.searchParams.set('id', ids.join(','));
    const res = await fetch(url);
    if(!res.ok) throw new Error('YouTube API fejl: ' + res.status);
    const data = await res.json();
    const map = {};
    (data.items || []).forEach(item => {
      map[item.id] = Number(item.statistics?.viewCount || 0);
    });
    return map;
  }

  async function ensureViews(){
    const cache = loadCache();
    const now = Date.now();
    const need = [];

    videoIds.forEach(id => {
      const entry = cache[id];
      if(!entry || !isFresh(entry.ts)) need.push(id);
    });

    for (let i=0; i<need.length; i+=50){
      const batch = need.slice(i, i+50);
      try {
        const stats = await fetchStats(batch);
        Object.entries(stats).forEach(([id, views])=>{
          cache[id] = { views, ts: now };
        });
      } catch(e){ console.error(e); }
    }

    saveCache(cache);

    // Opdater kort med visninger
    cards.forEach(card => {
      const id = getVideoIdFromCard(card);
      const views = cache[id]?.views || 0;
      card.dataset.views = views;

      // Badge nederst til højre
      if (!card.querySelector('.view-badge')){
        const badge = document.createElement('div');
        badge.className = 'view-badge';
        badge.textContent = formatViews(views);
        card.appendChild(badge);
      } else {
        card.querySelector('.view-badge').textContent = formatViews(views);
      }
    });
  }

  function formatViews(n){
    if (n >= 1_000_000) return (n/1_000_000).toFixed(1).replace('.0','') + 'M';
    if (n >= 1_000) return (n/1_000).toFixed(1).replace('.0','') + 'K';
    return String(n);
  }

  function applySort(mode){
    let sorted;
    switch(mode){
      case 'aeldste':
        sorted = [...cards].sort((a,b)=>a.dataset.index-b.dataset.index);
        break;
      case 'populaer':
        sorted = [...cards].sort((a,b)=>(b.dataset.views||0)-(a.dataset.views||0));
        break;
      default:
        sorted = [...cards].sort((a,b)=>b.dataset.index-a.dataset.index);
    }
    grid.innerHTML = '';
    sorted.forEach(c=>grid.appendChild(c));
  }

  (async function init(){
    await ensureViews();
    applySort('seneste');
  })();

  select.addEventListener('change', e => applySort(e.target.value));
</script>
