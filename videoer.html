 <script>
  // ***** Sæt din API-nøgle her *****
  const YT_API_KEY = "AIzaSyDyUTI3GYxqcN-sDHPDCK9OOjhS6l6q8c4"; // <- udfyld

  const CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 6 timer
  const grid   = document.querySelector('.video-grid');
  const cards  = Array.from(grid.children);
  const select = document.getElementById('sortSelect');

  // Hjælper: find YouTube ID fra iframe
  function getId(card){
    const iframe = card.querySelector('iframe');
    if(!iframe) return null;
    const m = String(iframe.src).match(/embed\/([a-zA-Z0-9_-]{6,})/);
    return m ? m[1] : null;
  }
  const videoIds = cards.map(getId).filter(Boolean);

  // Cache helpers
  const cacheKey = 'yt_stats_cache_v2';
  const loadCache = () => { try { return JSON.parse(localStorage.getItem(cacheKey)||'{}'); } catch { return {}; } };
  const saveCache = (obj) => localStorage.setItem(cacheKey, JSON.stringify(obj));
  const isFresh   = (ts) => (Date.now() - ts) < CACHE_TTL_MS;

  // Hent views + publishedAt for op til 50 IDs ad gangen
  async function fetchMeta(ids){
    if (!ids.length) return {};
    const url = new URL('https://www.googleapis.com/youtube/v3/videos');
    url.searchParams.set('key', YT_API_KEY);
    url.searchParams.set('part', 'statistics,snippet');
    url.searchParams.set('id', ids.join(','));
    const res = await fetch(url);
    if(!res.ok) throw new Error('YouTube API fejl: ' + res.status);
    const data = await res.json();
    const map = {};
    (data.items || []).forEach(it => {
      const views = Number(it.statistics?.viewCount || 0);
      const pub   = Date.parse(it.snippet?.publishedAt || 0); // ms timestamp
      map[it.id]  = { views, pub };
    });
    return map;
  }

  // Formatering (da-DK)
  const nf = new Intl.NumberFormat('da-DK');
  function formatViews(n){
    // brug fuldt tal i DK-format (285.421)
    return nf.format(n) + ' visninger';
  }

  // Lav/Opdater badge
  function upsertBadge(card, views){
    let pill = card.querySelector('.meta-pill');
    if(!pill){
      pill = document.createElement('div');
      pill.className = 'meta-pill';
      pill.innerHTML = `
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3.5"/></svg>
        <span class="meta-text"></span>
      `;
      card.appendChild(pill);
    }
    pill.querySelector('.meta-text').textContent = formatViews(views);
  }

  async function ensureMeta(){
    const cache = loadCache();
    const now   = Date.now();
    const need  = [];

    videoIds.forEach(id => {
      const e = cache[id];
      if (!e || !isFresh(e.ts)) need.push(id);
    });

    for(let i=0;i<need.length;i+=50){
      const batch = need.slice(i,i+50);
      try{
        const map = await fetchMeta(batch);
        Object.entries(map).forEach(([id, v]) => {
          cache[id] = { ...v, ts: now };
        });
      }catch(err){ console.error(err); }
    }
    saveCache(cache);

    // Sæt data på kort + lav badges
    cards.forEach(card => {
      const id = getId(card);
      const meta = cache[id] || { views:0, pub:0 };
      card.dataset.views = String(meta.views);
      card.dataset.pub   = String(meta.pub);
      upsertBadge(card, meta.views);
    });
  }

  function applySort(mode){
    let sorted;
    if(mode === 'populaer'){
      sorted = [...cards].sort((a,b)=> (b.dataset.views|0) - (a.dataset.views|0));
    }else{
      // Seneste = sortér efter publishedAt (desc)
      sorted = [...cards].sort((a,b)=> (b.dataset.pub|0) - (a.dataset.pub|0));
    }
    grid.innerHTML = '';
    sorted.forEach(c => grid.appendChild(c));
  }

  (async function init(){
    await ensureMeta();
    applySort('seneste');                 // default
    select.value = 'seneste';
  })();

  select.addEventListener('change', e => applySort(e.target.value));
</script>
