 <script>
  // <-- DIN API-NØGLE
  const YT_API_KEY = "AIzaSyDyUTI3GYxqcN-sDHPDCK9OOjhS6l6q8c4";

  const CACHE_TTL_MS = 6 * 60 * 60 * 1000;
  const CACHE_KEY = 'yt_views_v2_' + location.host;

  const grid   = document.querySelector('.video-grid');
  const cards  = Array.from(grid.querySelectorAll('.video-card'));
  const select = document.getElementById('sortSelect');

  // Gem den helt oprindelige DOM-rækkefølge (seneste)
  const originalOrder = cards.slice();
  // Sæt et stabilt order-id (hjælper, hvis andre scripts rører DOM)
  originalOrder.forEach((el,i)=> el.dataset.order = i);

  // Hjælper: hent video-id (brug data-video-id hvis du vil være helt sikker)
  function getId(card){
    if (card.dataset.videoId) return card.dataset.videoId.trim();
    const iframe = card.querySelector('iframe');
    const m = iframe && String(iframe.src).match(/embed\/([a-zA-Z0-9_-]{6,})/);
    return m ? m[1] : null;
  }
  const videoIds = cards.map(getId).filter(Boolean);

  // Cache helpers
  const loadCache = () => { try { return JSON.parse(localStorage.getItem(CACHE_KEY)||'{}'); } catch { return {}; } };
  const saveCache = (obj) => localStorage.setItem(CACHE_KEY, JSON.stringify(obj));
  const isFresh   = (ts) => (Date.now() - ts) < CACHE_TTL_MS;

  async function fetchViews(ids){
    if(!ids.length) return {};
    const url = new URL('https://www.googleapis.com/youtube/v3/videos');
    url.searchParams.set('key', YT_API_KEY);
    url.searchParams.set('part', 'statistics');
    url.searchParams.set('id', ids.join(','));
    const res = await fetch(url);
    if(!res.ok) throw new Error('YouTube API fejl: ' + res.status);
    const data = await res.json();
    const map = {};
    (data.items||[]).forEach(it => map[it.id] = Number(it.statistics?.viewCount || 0));
    return map;
  }

  // badge
  const nf = new Intl.NumberFormat('da-DK');
  const formatViews = n => nf.format(n) + ' visninger';
  function upsertBadge(card, views){
    let pill = card.querySelector('.meta-pill');
    if(!pill){
      pill = document.createElement('div');
      pill.className = 'meta-pill';
      pill.innerHTML = `
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
          <circle cx="12" cy="12" r="3.5"/>
        </svg>
        <span class="meta-text"></span>
      `;
      card.appendChild(pill);
    }
    pill.querySelector('.meta-text').textContent = formatViews(views);
  }

  async function ensureViews(){
    const cache = loadCache();
    const now   = Date.now();
    const need  = [];

    videoIds.forEach(id => {
      const e = cache[id];
      if(!e || !isFresh(e.ts)) need.push(id);
    });

    for(let i=0;i<need.length;i+=50){
      const batch = need.slice(i,i+50);
      try{
        const got = await fetchViews(batch);
        Object.entries(got).forEach(([id, views]) => cache[id] = { views, ts: now });
      }catch(err){ console.error(err); }
    }
    saveCache(cache);

    cards.forEach(card => {
      const id = getId(card);
      const v  = cache[id]?.views ?? 0;
      card.dataset.views = String(v);
      upsertBadge(card, v);
    });
  }

  function renderOrder(list){
    const frag = document.createDocumentFragment();
    list.forEach(el => frag.appendChild(el));
    grid.innerHTML = '';
    grid.appendChild(frag);
  }

  function applySort(mode){
    if(mode === 'populaer'){
      renderOrder([...cards].sort((a,b)=>(b.dataset.views|0)-(a.dataset.views|0)));
    }else{
      // SENESTE = præcis den oprindelige DOM-rækkefølge
      renderOrder([...originalOrder].sort((a,b)=>a.dataset.order - b.dataset.order));
    }
  }

  // Tving default til “seneste” ved load (ignorer gamle valg)
  localStorage.removeItem('video_sort_choice');
  select.value = 'seneste';

  (async function init(){
    await ensureViews();
    applySort('seneste'); // vis den rækkefølge, du har i HTML
  })();

  select.addEventListener('change', e => {
    const m = e.target.value;
    applySort(m);
    localStorage.setItem('video_sort_choice', m); // gem fremover, men vi starter altid i “seneste”
  });
</script>

	<script>

    const btn = document.querySelector('.nav-toggle');
    const nav = document.querySelector('.nav');
    if(!btn || !nav) return;
    btn.addEventListener('click', () => {
      const open = nav.classList.toggle('is-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      document.body.style.overflow = open ? 'hidden' : '';
    });
  })();
</script>
